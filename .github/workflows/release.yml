name: Linux release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            xz-utils

      - name: Enable Linux desktop and fetch packages
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Verify
        run: |
          flutter analyze
          flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package release bundle
        run: |
          ARCHIVE="Indexed-linux-x64-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux/x64/release/bundle .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Indexed ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
