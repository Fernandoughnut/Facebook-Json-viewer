name: Flutter checks

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            xz-utils
      - name: Enable desktop and fetch packages
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify release builds still compile
        run: |
          flutter build linux --release
          ./tool/build_android.sh
